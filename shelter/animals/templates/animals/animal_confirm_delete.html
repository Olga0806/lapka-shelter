{% extends 'animals/base.html' %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width:520px;">
    <div class="card-body">
        <h3>Удалить?</h3>
        <p>Вы точно хотите удалить <b>{{ animal.name }}</b>?</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger">Удалить</button>
            <a href="{% url 'animal_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
