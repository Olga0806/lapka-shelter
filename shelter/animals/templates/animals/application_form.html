{% extends 'animals/base.html' %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width:640px;">
    <div class="card-body">
        <h3>Заявка #{{ app_obj.id }}</h3>
        <p class="text-muted">Животное: <b>{{ app_obj.animal.name }}</b></p>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <button class="btn btn-success">Сохранить</button>
            <a href="{% url 'application_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
